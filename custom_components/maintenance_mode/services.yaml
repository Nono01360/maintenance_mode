stop:

schedule:
  fields:
    start:
      required: true
      selector:
        datetime:
    duration:
      selector:
        duration:
    end:
      selector:
        datetime:
    reason:
      selector:
        text:
    pages:
      selector:
        text:
          multiple: true
    pause_automations:
      default: true
      selector:
        boolean:
    max_minutes:
      selector:
        number:
          min: 0
          max: 525600
          unit_of_measurement: min
